<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Possible Points Breakdown</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" defer></script>
    <style>
        body { 
            font-family: Verdana, Geneva, sans-serif; 
            margin: 0; padding: 0;
            background: linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.45)), url('./grass.png') center center fixed;
            background-size: cover;
        }
        .container { max-width: 680px; margin: auto; padding: 20px; }
        .card {
            background: white; border: 1px solid #ccc; margin-bottom: 16px;
            padding: 12px 16px; border-radius: 8px; box-shadow: 0 4px 16px rgba(0,0,0,0.35);
        }
        h1 { text-align: center; color: #2c3e50; white-space: nowrap; }
        h2 { text-align: center; color: #2c3e50; margin-top: 40px; margin-bottom: 20px; }
        h3 { color: #555; margin-top: 0; font-size: 1.2em; }
        .text-center-h3 { text-align: center; }

        /* TOTAL POINTS BOX */
        .total-box {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background-color: #000; color: #fff; font-weight: bold;
            border-radius: 16px; width: 120px; height: 120px;
            margin: 16px auto 8px auto;
        }
        .total-box .total-val { font-size: 3em; line-height: 1.1; }

        /* MATCHES GRID (No Actual Column) */
        .match-grid { 
            display: grid; grid-template-columns: 1fr 110px 110px; 
            gap: 6px; padding: 5px 8px; border-bottom: 1px solid #eee; align-items: center;
        }
        .header { font-weight: bold; background: #e9ecef; border-radius: 4px; }
        .match-grid span:first-child { text-align: left; }
        .match-grid span:nth-child(n+2) { text-align: center; }
        
        /* RANKINGS GRID (No Actual Column) */
        .rank-grid { 
            display: grid; grid-template-columns: 1fr 0.5fr; 
            gap: 4px; align-items: center; text-align: center;
        }
        .rank-header { font-weight: bold; background: #e9ecef; padding: 4px; border-radius: 4px; }
        .rank-col { text-align: center; }
        .rank-item { padding: 3px; border-bottom: 1px solid #eee; font-size: 0.9em; }

        /* BRACKET GRID (No Actual Column) */
        .bracket-grid {
            display: grid;
            grid-template-columns: 1fr 80px;
            gap: 0;
            align-items: stretch;
        }
        .bracket-header {
            font-weight: bold; background: #e9ecef;
            padding: 6px 8px; border-radius: 4px;
            text-align: center; font-size: 1em;
        }
        .game-cell { padding: 4px 2px 4px 8px; font-size: 1em; }
        .game-cell.predicted { padding-left: 16px; padding-right: 32px; }
        
        /* Justification logic: Name right, Score left */
        .team-row { display: flex; align-items: center; }
        .team-name { flex: 1; text-align: right; padding-right: 8px; }
        .team-score { width: 25px; text-align: left; font-weight: bold; }
        
        /* Point Status Tags */
        .pts-0 { background-color: #FFC7CE; color: #EA002D; font-weight: bold; padding: 2px 16px; border-radius: 3px; display: inline-block; min-width: 24px; }
        .pts-1 { background-color: #FFF49F; color: #CC7000; font-weight: bold; padding: 2px 16px; border-radius: 3px; display: inline-block; min-width: 24px; }
        .pts-2 { background-color: #C6EFCE; color: #006100; font-weight: bold; padding: 2px 16px; border-radius: 3px; display: inline-block; min-width: 24px; }
        
        .pts-span {
            display: flex; align-items: center; justify-content: center;
            font-size: 1.6em; font-weight: bold;
            border-radius: 3px;
        }
        .pts-zero  { background-color: #FFC7CE; color: #EA002D; }
        .pts-pos   { background-color: #C6EFCE; color: #006100; }

        .pts-cell { display: flex; flex-direction: column; height: 100%; justify-content: center; }
        .pts-val { font-size: 2em; font-weight: bold; }
        .pts-low { background-color: #FFC7CE; color: #EA002D; border-radius: 3px; }
        .pts-mid { background-color: #FFF49F; color: #CC7000; border-radius: 3px; }
        .pts-high { background-color: #C6EFCE; color: #006100; border-radius: 3px; }

        .game-divider { grid-column: 1 / -1; border: none; margin: 10px 0; }
        
        /* STICKY HEADER & NAVBAR OVERRIDES */
        .navbar { position: relative !important; }
        .sticky-header { position: sticky; top: 0; z-index: 999; background-color: #e3e7e8; }
        .sticky-header .container { max-width: 100%; }
        .sticky-divider { border: none; border-top: 2px solid #dee2e6; margin: 0; }

        .champion-pts { min-height: 96px; font-size: 1.8em; }
        .champion-row {
            display: flex; align-items: center; justify-content: center;
            padding-left: 0 !important; padding-right: 0 !important;
        }
        .champion-row .team-row { width: 100%; justify-content: center; align-items: center; }
        .champion-row .team-name {
            flex: 0 0 auto; text-align: center; padding-right: 0;
            text-transform: uppercase; font-size: 1.6em; font-weight: bold;
            white-space: nowrap; color: #004cff;
        }
        .champion-row .team-score { display: none; }

        /* RESPONSIVE DESIGN */
        @media (max-width: 700px) {
            .container { max-width: 100%; padding: 10px; }
            .match-grid { grid-template-columns: 1fr 75px 75px; font-size: 0.8em; }
            .bracket-grid { grid-template-columns: 1fr 60px; }
            .game-cell { font-size: 0.75em; padding: 3px 2px 3px 5px; }
            .game-cell.predicted { padding-left: 8px; padding-right: 16px; }
            h1 { font-size: 1.2em; }
            h2 { font-size: 1em; margin-top: 24px; }
            h3 { font-size: 0.9em; }
            .total-box { width: 90px; height: 90px; }
            .total-box .total-val { font-size: 2.2em; }
        }
    </style>
</head>
<body>

<div class="sticky-header">
    <div id="navbar"></div>
    <div class="container">
        <h1 id="participantTitle">Loading...</h1>
        <div id="totalBox"></div>
    </div>
    <hr class="sticky-divider">
</div>

<div class="container">
    <div id="content"></div>
</div>

<script>
    // Navbar Import Setup
    fetch('../navbar.html')
        .then(response => response.text())
        .then(html => {
            const navEl = document.getElementById('navbar');
            navEl.innerHTML = html.replace(/<script[\s\S]*?<\/script>/gi, '');
            const scriptMatch = html.match(/<script>([\s\S]*?)<\/script>/i);
            if (scriptMatch) {
                const s = document.createElement('script');
                s.textContent = scriptMatch[1];
                document.body.appendChild(s);
            }
        });

    const params = new URLSearchParams(window.location.search);
    const rawName = params.get('name') || "Participant";
    const displayName = rawName;
    document.getElementById('participantTitle').innerText = `${displayName}'s POSSIBLE Points`;

    function renderTeam(name, score) {
        return `
            <div class="team-row">
                <span class="team-name">${name ?? ''}</span>
                <span class="team-score">${score ?? ''}</span>
            </div>`;
    }

    function buildRoundCard(title, games) {
        let html = `<div class="card">
            <h3 class="text-center-h3">${title}</h3>
            <div class="bracket-grid">
                <div class="bracket-header">Predicted</div>
                <div class="bracket-header">Pts</div>
                <div style="height:10px"></div><div style="height:10px"></div>`;

        games.forEach((g, i) => {
            const ptsClass = g.pts_awarded === 0 ? 'pts-zero' : 'pts-pos';
            
            html += `
                <div class="game-cell predicted">${renderTeam(g.pred_home_name, g.pred_home_score)}</div>
                <div class="pts-span ${ptsClass}" style="grid-row: span 2">${g.pts_awarded ?? ''}</div>
                <div class="game-cell predicted">${renderTeam(g.pred_away_name, g.pred_away_score)}</div>`;

            if (i < games.length - 1) {
                html += `<hr class="game-divider">`;
            }
        });

        html += `</div></div>`;
        return html;
    }

    function buildChampionCard(title, game) {
        const ptsClass = game.pts_awarded === 0 ? 'pts-zero' : 'pts-pos';

        return `
            <div class="card">
                <h3 class="text-center-h3">${title}</h3>
                <div class="bracket-grid">
                    <div class="bracket-header">Predicted</div>
                    <div class="bracket-header">Pts</div>

                    <div style="height:10px"></div>
                    <div style="height:10px"></div>

                    <div class="game-cell predicted champion-row" style="min-height:64px;">
                        ${renderTeam(game.pred_home_name, '')}
                    </div>

                    <div class="pts-span ${ptsClass} champion-pts" style="min-height:64px;">
                        ${game.pts_awarded ?? ''}
                    </div>
                </div>
            </div>`;
    }

    // Dynamic extraction processing from possible_pts.json
    fetch('./possible_pts.json')
        .then(response => response.json())
        .then(data => {
            const pData = data[rawName];
            if (!pData) return;

            // Load Total Score Frame
            document.getElementById('totalBox').innerHTML = `
                <div class="total-box">
                    <div class="total-val">${pData.total_points ?? '—'}</div>
                </div>`;
            
            const formatGroup = (g) => g.replace('Group', 'Group ');
            let html = "";

            // 1. GROUP MATCHES COMPONENT
            if (pData.matches) {
                html += "<h2>Group Matches</h2>";
                for (const group in pData.matches) {
                    html += `<div class="card"><h3>${formatGroup(group)}</h3>
                             <div class="match-grid header">
                                <span>Matchup</span><span>Predicted</span><span>Pts</span>
                             </div>`;
                    pData.matches[group].forEach(m => {
                        let mClass = m.pts_awarded === 0 ? "pts-0" : m.pts_awarded === 1 ? "pts-1" : "pts-2";
                        html += `<div class="match-grid">
                                    <span>${m.home_name} vs ${m.away_name}</span>
                                    <span>${m.home_score} - ${m.away_score}</span>
                                    <span class="${mClass}">${m.pts_awarded}</span>
                                 </div>`;
                    });
                    html += `</div>`;
                }
            }

            // 2. GROUP RANK COMPONENT
            if (pData.rankings) {
                html += "<h2>Group Rank</h2>";
                for (const group in pData.rankings) {
                    const groupPoints = pData.rankings[group].player_ranking.length > 0 
                                      ? pData.rankings[group].player_ranking[0].pts_awarded : 0;
                    
                    let rankClass = "pts-low"; 
                    if (groupPoints === 4 || groupPoints === 5) rankClass = "pts-mid";
                    else if (groupPoints === 9) rankClass = "pts-high";
                                      
                    html += `<div class="card"><h3 style="text-align:center">${formatGroup(group)}</h3>
                             <div class="rank-grid">
                                <div class="rank-header">${displayName}'s Order</div>
                                <div class="rank-header">Pts</div>
                                
                                <div class="rank-col">
                                    ${pData.rankings[group].player_ranking.map(r => `<div class="rank-item">${r.rank_name}</div>`).join('')}
                                </div>
                                <div class="pts-cell ${rankClass}">
                                    <div class="pts-val">${groupPoints}</div>
                                </div>
                             </div></div>`;
                }
            }

            // 3. KNOCKOUT STAGE COMPONENT (Placed safely below group stage modules)
            const rounds = [
                { key: 'round_of_32',   title: 'Round-of-32' },
                { key: 'round_of_16',   title: 'Round-of-16' },
                { key: 'quarterfinals', title: 'Quarter-finals' },
                { key: 'semifinals',    title: 'Semi-finals' },
                { key: 'finals',        title: 'Finals' },
                { key: 'champions',     title: 'CHAMPIONS' }
            ];

            let knockoutHtml = "";
            let hasKnockoutContent = false;

            rounds.forEach(r => {
                const games = pData[r.key] || [];
                if (games.length === 0) return;
                hasKnockoutContent = true;

                if (r.key === 'champions') {
                    knockoutHtml += buildChampionCard(r.title, games[0]);
                } else {
                    knockoutHtml += buildRoundCard(r.title, games);
                }
            });

            if (hasKnockoutContent) {
                html += "<h2>Knockout Stage</h2>" + knockoutHtml;
            }

            document.getElementById('content').innerHTML = html;
        });
</script>
</body>
</html>
